format: named-telemetry-events
summary: >-
  Zilla's published failure surface is a catalog of NAMED TELEMETRY EVENTS, not
  an HTTP error-code registry and not RFC 9457 problem documents. Every event
  below is emitted by the engine and can be routed to stdout, syslog, AWS
  CloudWatch, OTLP or Prometheus via a telemetry exporter, which makes this the
  artifact an operator or an agent actually watches to know why a request was
  refused. Names are transcribed verbatim from the 2.x reference; no severity,
  remediation text or HTTP status is asserted here because the provider
  publishes none. The event set is scoped to the gateway a customer runs —
  Aklivity operates no hosted API, so there is no upstream error envelope of
  its own to document.
exporters:
  - stdout
  - syslog
  - aws-cloudwatch
  - otlp
  - prometheus
observed_via: zilla logs -f --format <format>
