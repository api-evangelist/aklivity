naftiko: "1.0.0-alpha1"
info:
  label: "Zilla Gateway"
  description: "Aklivity Zilla multi-protocol gateway providing HTTP-to-Kafka, MQTT-to-Kafka, and gRPC-to-Kafka protocol translation."
  tags:
    - Aklivity
    - Kafka
    - API Gateway
    - Multi-Protocol
  created: "2026-04-19"
  modified: "2026-04-19"
binds:
  - namespace: env
    keys:
      KAFKA_BOOTSTRAP_SERVERS: KAFKA_BOOTSTRAP_SERVERS
      ZILLA_HOST: ZILLA_HOST
      ZILLA_PORT: ZILLA_PORT
capability:
  consumes:
    - type: http
      namespace: zilla-gateway
      baseUri: http://{host}:{port}
      description: "Zilla HTTP-to-Kafka proxy endpoints"
      resources:
        - name: kafka-messages
          path: /messages
          description: "Kafka message production and consumption via HTTP"
          operations:
            - name: produce-message
              method: POST
              description: "Produce a message to a Kafka topic"
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: "$."
              body:
                type: json
                data:
                  key: "{{tools.key}}"
                  value: "{{tools.value}}"
            - name: consume-messages
              method: GET
              description: "Consume messages from a Kafka topic"
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: "$."
  exposes:
    - type: rest
      port: 8100
      namespace: zilla-gateway-api
      resources:
        - path: /v1/messages
          name: messages
          description: "Kafka messages via HTTP"
          operations:
            - method: POST
              name: produce-message
              description: "Produce message to Kafka"
              call: "zilla-gateway.produce-message"
              outputParameters:
                - type: object
                  mapping: "$."
            - method: GET
              name: consume-messages
              description: "Consume messages from Kafka"
              call: "zilla-gateway.consume-messages"
              outputParameters:
                - type: object
                  mapping: "$."
    - type: mcp
      port: 9100
      namespace: zilla-gateway-mcp
      transport: http
      tools:
        - name: produce-kafka-message
          description: "Produce a message to a Kafka topic via Zilla HTTP gateway"
          hints:
            readOnly: false
            destructive: false
          call: "zilla-gateway.produce-message"
          with:
            key: "tools.key"
            value: "tools.value"
          outputParameters:
            - type: object
              mapping: "$."
        - name: consume-kafka-messages
          description: "Consume messages from a Kafka topic via Zilla HTTP gateway"
          hints:
            readOnly: true
            openWorld: true
          call: "zilla-gateway.consume-messages"
          outputParameters:
            - type: object
              mapping: "$."
