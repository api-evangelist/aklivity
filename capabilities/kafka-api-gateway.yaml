naftiko: "1.0.0-alpha1"
info:
  label: "Aklivity Kafka API Gateway"
  description: "Workflow for exposing Apache Kafka topics as REST APIs and managing event-driven integrations via Zilla. Enables HTTP, MQTT, and gRPC clients to produce and consume Kafka events without Kafka client libraries."
  tags:
    - Aklivity
    - Kafka
    - API Gateway
    - Event-Driven
    - Multi-Protocol
    - Real-Time
  created: "2026-04-19"
  modified: "2026-04-19"
binds:
  - namespace: env
    keys:
      KAFKA_BOOTSTRAP_SERVERS: KAFKA_BOOTSTRAP_SERVERS
      ZILLA_HOST: ZILLA_HOST
      ZILLA_PORT: ZILLA_PORT
capability:
  consumes:
    - import: zilla-gateway
      location: ./shared/zilla-gateway.yaml
  exposes:
    - type: rest
      port: 8080
      namespace: kafka-api-gateway-api
      description: "Unified REST API for Kafka event production and consumption via Zilla."
      resources:
        - path: /v1/events
          name: events
          description: "Kafka event production and consumption"
          operations:
            - method: POST
              name: produce-event
              description: "Produce an event to Kafka"
              call: "zilla-gateway.produce-message"
              outputParameters:
                - type: object
                  mapping: "$."
            - method: GET
              name: consume-events
              description: "Consume events from Kafka"
              call: "zilla-gateway.consume-messages"
              outputParameters:
                - type: object
                  mapping: "$."
    - type: mcp
      port: 9090
      namespace: kafka-api-gateway-mcp
      transport: http
      description: "MCP server for AI-assisted Kafka event streaming via Zilla gateway."
      tools:
        - name: produce-kafka-event
          description: "Produce an event to a Kafka topic via Zilla HTTP gateway"
          hints:
            readOnly: false
            destructive: false
          call: "zilla-gateway.produce-message"
          with:
            key: "tools.key"
            value: "tools.value"
          outputParameters:
            - type: object
              mapping: "$."
        - name: consume-kafka-events
          description: "Consume events from a Kafka topic via Zilla HTTP gateway"
          hints:
            readOnly: true
            openWorld: true
          call: "zilla-gateway.consume-messages"
          outputParameters:
            - type: object
              mapping: "$."
