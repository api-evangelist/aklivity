aid: aklivity
name: Aklivity
description: >-
  Aklivity builds Zilla, a stateless, source-available multi-protocol gateway
  for event-driven applications and AI agents. Zilla translates HTTP, SSE,
  WebSocket, MQTT, gRPC and MCP Streamable HTTP to and from Apache Kafka and
  other backends, configured declaratively in a zilla.yaml or driven directly
  from an OpenAPI or AsyncAPI document, with no custom code, connectors or
  separate MQTT broker. The Zilla MCP Gateway compiles OpenAPI specs, Kafka
  topics, Kafka Connect and schema registries into governed MCP tool sets that
  agents call through one authenticated endpoint. The Zilla Console adds an API
  and data-product catalog, a self-service developer portal, governance, audit
  and RBAC. Aklivity is a software vendor rather than a service operator: every
  Zilla runs inside the customer's own infrastructure, so there is no hosted
  Aklivity API and no Aklivity-issued credential.
