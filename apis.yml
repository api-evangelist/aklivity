  - type: Features
    data:
      - name: Multi-Protocol Kafka Access
        description: >-
          Translates HTTP REST, gRPC, MQTT, SSE, and WebSocket protocols
          directly to Kafka topics without custom code, connectors, or
          middleware.
      - name: Declarative Configuration
        description: >-
          Define gateways and protocol mappings via YAML configuration or
          AsyncAPI specifications, then deploy with Docker, Helm, or native
          binaries.
      - name: JWT Authentication and TLS
        description: >-
          Built-in JWT token validation, TLS termination, and Kafka SASL
          support for securing API access to Kafka clusters.
      - name: Schema Validation
        description: >-
          SIMD-optimized runtime schema validation for JSON, Avro, and Protobuf
          via Confluent Schema Registry or AWS Glue Schema Registry.
      - name: Observability
        description: >-
          Metrics and logs exported to Prometheus and OpenTelemetry for unified
          visibility across Kafka API traffic.
      - name: Kafka Governance
        description: >-
          Topic naming policies, runtime enforcement, schema compliance rules,
          and API data product versioning with rate limits via Zilla Platform.
      - name: Self-Service Developer Portal
        description: >-
          API key and certificate management self-service portal for Kafka
          consumers and producers via Zilla Platform.
      - name: Field-Level Encryption
        description: >-
          PII classification and field-level encryption for sensitive data
          in Kafka messages via Zilla Platform.
  - type: UseCases
    data:
      - name: HTTP to Kafka REST API
        description: >-
          Expose Kafka topics as REST API endpoints, allowing any HTTP client
          to produce and consume Kafka messages without Kafka client libraries.
      - name: IoT MQTT to Kafka
        description: >-
          Connect IoT devices using MQTT protocol directly to Kafka topics,
          eliminating the need for a separate MQTT broker.
      - name: gRPC to Kafka
        description: >-
          Route gRPC calls from microservices to Kafka topics for event-driven
          inter-service communication.
      - name: Kafka Self-Service Platform
        description: >-
          Platform teams build internal developer portals for Kafka access with
          governance, rate limiting, and self-service API key management.
      - name: Event-Driven Partner Integration
        description: >-
          Enterprises expose Kafka event streams to external partners via
          secured, rate-limited REST or SSE APIs.
      - name: Financial Services Data Distribution
        description: >-
          Financial institutions distribute real-time market data and trade
          events via secured Kafka API gateways.
  - type: Integrations
    data:
      - name: Apache Kafka
        description: Core integration — Zilla acts as a multi-protocol proxy in front of any Kafka cluster
      - name: AWS MSK
        description: Managed Streaming for Apache Kafka integration with AWS-native security
      - name: Confluent Schema Registry
        description: Schema validation and enforcement using Confluent Schema Registry
      - name: AWS Glue Schema Registry
        description: Schema validation using AWS Glue Schema Registry
      - name: Prometheus
        description: Metrics export for monitoring Zilla gateway performance
      - name: OpenTelemetry
        description: Distributed tracing and observability via OpenTelemetry
      - name: AWS Secrets Manager
        description: Secure credential management for Kafka and TLS configurations
  - type: Integrations
    url: https://www.aklivity.io/partners
  - url: https://www.aklivity.io/blog
    type: Blog
