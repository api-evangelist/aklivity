        url: https://docs.aklivity.io/latest/cookbooks/quickstart/
      - type: GitHubRepository
        url: https://github.com/aklivity/zilla
      - type: JSONSchema
        url: json-schema/aklivity-zilla-engine.schema.json
      - type: Postman
        url: https://www.postman.com/aklivity-zilla/workspace/aklivity-zilla-quickstart/overview
  - aid: aklivity:zilla-platform
    name: Zilla Platform
    description: >-
      The Zilla Platform adds an enterprise management layer on top of Zilla
      Gateway, providing API data products with versioning and rate limits, Kafka
      governance policies, a self-service developer portal with API key and
      certificate management, field-level encryption, PII classification, and
      unified observability across Kafka deployments.
    humanURL: https://www.aklivity.io/zilla-platform
    tags:
      - API Management
      - Developer Portal
      - Governance
      - Kafka Management
      - Observability
    properties:
      - type: Documentation
        url: https://docs.aklivity.io/latest/zilla-console/
      - type: GettingStarted
        url: https://docs.aklivity.io/latest/deployment/zilla-console/helm/
  - aid: aklivity:zilla-mcp-gateway
    name: Zilla MCP Gateway
    description: >-
      The Zilla MCP Gateway is the AI-facing face of the Zilla engine. It
      terminates Model Context Protocol Streamable HTTP from an agent and routes
      each tool call to an upstream by toolkit name, so one authenticated
      endpoint fronts many providers. Tool sets are compiled rather than
      hand-written: mcp-openapi turns an OpenAPI document into tools, mcp-http
      exposes any REST API with no upstream MCP server, and mcp-kafka,
      mcp-kafka-connect and mcp-schema-registry connect straight to those
      backends. A listing cache answers tools/list, prompts/list and
      resources/list before any upstream is reached, and an OAuth guard carries
      per-user identity through to the call. Aklivity hosts no MCP endpoint of
      its own — the gateway is deployed and owned by the operator.
    humanURL: https://www.aklivity.io/zilla-mcp-gateway
    tags:
      - AI Gateway
      - Agent Infrastructure
      - MCP
      - OpenAPI
      - Tool Discovery
    properties:
      - type: Documentation
        url: https://docs.aklivity.io/latest/ai-gateway/
      - type: APIReference
        url: https://docs.aklivity.io/latest/reference/2.x/config/bindings/mcp/
      - type: GettingStarted
        url: https://docs.aklivity.io/latest/ai-gateway/get-started/
      - type: GitHubRepository
        url: https://github.com/aklivity/zilla
  - aid: aklivity:zillabase
    name: ZillaBase
    description: >-
      ZillaBase is an event-driven backend framework for the next generation of
      web, mobile, and AI applications, built on top of Apache Kafka and Zilla
      to enable real-time, event-sourced application development.
