apis:
  - aid: aklivity:zilla-gateway
    name: Zilla Gateway
    description: >-
      Zilla is a stateless, cloud-native multi-protocol edge and service proxy
      that enables seamless access to Apache Kafka through HTTP REST, gRPC, SSE,
      MQTT, and WebSocket protocols. Zilla eliminates the need for Kafka Connect,
      custom code, or separate MQTT brokers, translating client protocol requests
      directly to Kafka operations declaratively via YAML configuration or
      AsyncAPI specifications.
    humanURL: https://www.aklivity.io/zilla-kafka-gateway
    tags:
      - API Gateway
      - Apache Kafka
      - Event-Driven
      - Kafka Proxy
      - Multi-Protocol
    properties:
      - type: Documentation
        url: https://docs.aklivity.io/latest/kafka-gateway/
      - type: APIReference
        url: https://docs.aklivity.io/latest/reference/2.x/
