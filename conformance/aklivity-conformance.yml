provider: Aklivity
providerId: aklivity
summary: >-
  Aklivity is an implementer of standards rather than a publisher of its own
  contract. Zilla's value proposition is that it speaks other people's
  specifications: it is CONFIGURED from OpenAPI and AsyncAPI documents, it
  validates payloads against JSON Schema / Avro / Protobuf, and it terminates
  MQTT, gRPC, SSE, WebSocket and MCP Streamable HTTP on the wire. Each entry
  below cites the exact reference page or vendored schema that evidences it.
  NOTE ON CERTIFICATION: Aklivity publishes NO third-party security
  certification. Its Technical and Organizational Measures document (v1.0,
  effective 2025-01-06) states only "SOC 2-aligned internal controls
  (in-progress)". No `type: Compliance` pointer is wired in apis.yml, because
  an alignment claim in progress is not a published certification.
conformance:
  - id: openapi
    name: OpenAPI 3.0.3 / 3.1.0
    conforms: true
    role: consumer
    evidence: >-
      Zilla vendors the OpenAPI 3.0.3 and 3.1.0 meta-schemas at
      runtime/common-openapi/src/main/resources/io/aklivity/zilla/runtime/common/openapi/config/schema/
      and ships binding-openapi plus mcp-openapi, which compile a supplied
      OpenAPI document into routes and into an MCP tool set.
    docs: https://docs.aklivity.io/latest/concepts/api-specifications/openapi.html
  - id: asyncapi
    name: AsyncAPI 2.6.0 / 3.0.1
    conforms: true
    role: consumer
    evidence: >-
      Zilla vendors the AsyncAPI 2.6.0 and 3.0.1 meta-schemas at
      runtime/common-asyncapi/src/main/resources/io/aklivity/zilla/runtime/common/asyncapi/config/schema/
      and ships binding-asyncapi and binding-openapi-asyncapi, which configure
      HTTP, SSE, MQTT and Kafka bindings directly from an AsyncAPI document.
    docs: https://docs.aklivity.io/latest/concepts/api-specifications/asyncapi/
  - id: mcp
    name: Model Context Protocol (Streamable HTTP)
    conforms: true
    role: implementer
    evidence: >-
      mcp server/proxy/client bindings terminate and originate MCP Streamable
      HTTP; elicitation, tool/prompt/resource listing and session lifecycle are
      implemented and instrumented (BINDING_MCP_SESSION_ESTABLISHED,
      BINDING_MCP_SESSION_CLOSED, BINDING_MCP_ELICITATION_TIMEOUT).
    docs: https://docs.aklivity.io/latest/ai-gateway/mcp-gateway/how-it-works/
  - id: json-schema
    name: JSON Schema (draft-04 through 2020-12)
    conforms: true
    role: implementer
    evidence: >-
      model-json performs runtime payload validation; the repository carries the
      official JSON Schema conformance suites for draft6, draft7, 2019-09 and
      2020-12 under runtime/common-json/src/test/resources/.../conformance/.
      Zilla's own configuration contract, engine.schema.json, is written to
      JSON Schema draft 2019-09.
    docs: https://docs.aklivity.io/latest/reference/2.x/config/models/json.html
  - id: protobuf
    name: Protocol Buffers / gRPC
    conforms: true
    role: implementer
    evidence: >-
      binding-grpc (server, client, kafka proxy) and model-protobuf validate and
      route Protobuf payloads; MODEL_PROTOBUF_VALIDATION_FAILED is a named
      telemetry event.
    docs: https://docs.aklivity.io/latest/concepts/api-specifications/protobuf.html
  - id: avro
    name: Apache Avro
    conforms: true
    role: implementer
    evidence: model-avro with MODEL_AVRO_VALIDATION_FAILED telemetry event; Confluent, Karapace, Apicurio and AWS Glue schema registries supported as catalogs.
    docs: https://docs.aklivity.io/latest/reference/2.x/config/models/avro.html
  - id: mqtt
    name: MQTT
    conforms: true
    role: implementer
    evidence: binding-mqtt (server/client) and binding-mqtt-kafka turn Kafka into an MQTT broker without an intermediary broker; BINDING_MQTT_CLIENT_CONNECTED telemetry event.
    docs: https://docs.aklivity.io/latest/reference/2.x/config/bindings/mqtt/
  - id: sse
    name: Server-Sent Events (W3C/WHATWG EventSource)
    conforms: true
    role: implementer
    evidence: binding-sse and binding-sse-kafka expose Kafka topics as SSE streams.
    docs: https://docs.aklivity.io/latest/reference/2.x/config/bindings/sse/
  - id: websocket
    name: WebSocket (RFC 6455)
    conforms: true
    role: implementer
