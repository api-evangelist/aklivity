  - id: oauth2
    name: OAuth 2.0
    conforms: true
    role: implementer
    evidence: >-
      OAuth guard supporting client-credentials, jwt-bearer (RFC 7523) and token
      exchange (RFC 8693); vendor IdP guards for Azure AD, AWS Cognito and AWS
      IAM. Plus/Enterprise edition.
    docs: https://docs.aklivity.io/latest/ai-gateway/security/oauth-guard/
  - id: jwt
    name: JSON Web Token (RFC 7519) / JWKS
    conforms: true
    role: implementer
    evidence: guard-jwt validates bearer tokens against a configured JWKS; GUARD_JWT_AUTHORIZATION_FAILED telemetry event. Community edition.
    docs: https://docs.aklivity.io/latest/reference/2.x/config/guards/jwt.html
  - id: mtls
    name: Mutual TLS / X.509
    conforms: true
    role: implementer
    evidence: binding-tls with client certificate verification; vault-filesystem and vault-aws-secrets supply key pairs; BINDING_TLS_PEER_NOT_VERIFIED telemetry event.
    docs: https://docs.aklivity.io/latest/ai-gateway/security/tls/mtls/
  - id: opentelemetry
    name: OpenTelemetry Protocol (OTLP)
    conforms: true
    role: implementer
    evidence: exporter-otlp exports metrics and logs over OTLP.
    docs: https://docs.aklivity.io/latest/ai-gateway/monitoring-observability/exporters/otlp/
  - id: prometheus
    name: Prometheus exposition format
    conforms: true
    role: implementer
    evidence: exporter-prometheus serves engine, HTTP, gRPC, stream and Kafka metrics.
    docs: https://docs.aklivity.io/latest/ai-gateway/monitoring-observability/exporters/prometheus/
  - id: syslog
    name: Syslog (RFC 5424)
    conforms: true
    role: implementer
    evidence: exporter-syslog. Plus/Enterprise edition.
    docs: https://docs.aklivity.io/latest/ai-gateway/monitoring-observability/exporters/syslog/
  - id: kafka-protocol
    name: Apache Kafka wire protocol
    conforms: true
    role: implementer
    evidence: >-
      binding-kafka implements the Kafka protocol directly (cache_client,
      cache_server, client, server) rather than wrapping a Kafka client;
      BINDING_KAFKA_API_VERSION_REJECTED is a named telemetry event. Validated
      against Apache Kafka, AWS MSK, Confluent Cloud/Platform, Redpanda and
      Aiven.
    docs: https://docs.aklivity.io/latest/reference/2.x/config/bindings/kafka/
  - id: rfc9457
    name: RFC 9457 Problem Details for HTTP APIs
    conforms: false
    evidence: >-
      No application/problem+json envelope is defined anywhere in the Zilla
      configuration reference or in the telemetry events catalog. Zilla's own
      failure surface is a named event stream (see
      errors/aklivity-event-codes.yml), not an HTTP problem document; the HTTP
      error body a client sees is whatever the upstream or the operator's own
      configuration produces.
  - id: scim
    name: SCIM
    conforms: false
    evidence: Not implemented; no SCIM schema URN appears in the configuration schema or docs.
  - id: odata
    name: OData
    conforms: false
    evidence: Not implemented; no $metadata surface.
domain_standard:
  assessed: true
  market: API gateway / event streaming infrastructure
  finding: >-
    The domain standards for this market are OpenAPI, AsyncAPI and — newly —
    MCP, and Zilla declares all three IN ITS CONFIGURATION CONTRACT rather than
    only in marketing prose. engine.schema.json defines binding types `openapi`,
    `asyncapi`, `openapi-asyncapi`, `mcp`, `mcp-http`, `mcp-openapi`,
    `mcp-kafka`, `mcp-kafka-connect` and `mcp-schema-registry`, and the
    OpenAPI 3.0.3/3.1.0 and AsyncAPI 2.6.0/3.0.1 meta-schemas are vendored into
    the runtime so a supplied document is validated against the real
    specification before it is compiled into routes. A buyer who already
    maintains OpenAPI or AsyncAPI documents integrates with no bespoke
    connector; that is the whole product thesis.
  evidence:
    - json-schema/aklivity-zilla-engine.schema.json
    - runtime/common-openapi/src/main/resources/io/aklivity/zilla/runtime/common/openapi/config/schema/openapi.3.1.0.schema.json
    - runtime/common-asyncapi/src/main/resources/io/aklivity/zilla/runtime/common/asyncapi/config/schema/asyncapi.3.0.1.schema.json
    - https://docs.aklivity.io/latest/concepts/api-specifications/openapi-asyncapi.html
certifications:
  published: []
  note: >-
    None published. Aklivity TOMs v1.0 (2025-01-06) records "SOC 2-aligned
    internal controls (in-progress)", SAST and dependency scanning in CI,
    Trivy/Snyk container scans, pinned dependencies, an SBOM published with each
    release, MFA and RBAC on internal systems, and annual security training.
    That is a stated control set, not an attested certification, and it is
    scoped to Aklivity's build pipeline rather than to a managed service — the
    company runs none.
  source: https://cdn.prod.website-files.com/60e49b51af3305d435c286ab/67f98405cd38fed455d270cb_Aklivity_TOMs_Document.pdf
