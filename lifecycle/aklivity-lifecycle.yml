    zilla: 2.3.0
    zilla_released: '2026-08-14'
    zilla_1x_maintenance: 1.3.1
    zilla_1x_released: '2026-08-18'
  note: >-
    Zilla crossed from an 0.9.x train straight to 2.0.0 in 2026. Both lines are
    live: 1.3.1 shipped four days AFTER 2.3.0, so 1.x is receiving maintenance
    releases in parallel rather than being frozen. Release cadence on the 2.x
    line is measured in days — 2.1.0, 2.1.1, 2.2.0, 2.2.1, 2.2.2, 2.2.3 and
    2.3.0 all shipped between 2026-08-08 and 2026-08-14.
  reference_versions_documented:
    - '1.x'
    - '2.x'
  note_docs: >-
    The configuration reference is published twice, at
    /latest/reference/1.x/ and /latest/reference/2.x/, so an operator on either
    line can confirm prior behavior. That is an unusually explicit versioned
    documentation posture for a project this size.
release_notes:
