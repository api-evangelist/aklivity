  note: >-
    Three products, three cadences, tracked separately. The Zilla Plus release
    notes record which Zilla version each commercial release bundles.
deprecation:
  policy_published: true
  form: migration-guide
  url: https://docs.aklivity.io/latest/deployment/migrating-to-2.x/
  repo_file: https://github.com/aklivity/zilla/blob/develop/MIGRATING.md
  scope: >-
    Scoped to the core zilla repository (engine and in-tree bindings, guards and
    vaults). Components shipped from other repositories, for example zilla-plus,
    are covered separately.
  sunset_headers: false
  sunset_headers_note: >-
    No RFC 8594 Sunset/Deprecation header policy is published, and none would
    apply — Aklivity operates no hosted endpoint to send one from. Breaking
    change is communicated as a config-migration document instead.
  breaking_changes_1x_to_2x:
    - zilla.json fallback removed; zilla.yaml is the only config file format
    - 'binding-kafka: client-kind bindings no longer route by topic condition'
    - 'binding-kafka: options.sasl removed in favor of options.authorization'
    - 'binding-grpc: options.services removed in favor of a catalog'
    - 'binding-mqtt-kafka: options.server removed in favor of the engine service.hostname property'
    - 'binding-mqtt: kind server now requires options.store'
    - 'binding-tcp: routes[].exit is now enforced for kind server'
    - 'binding-openapi / binding-asyncapi / binding-openapi-asyncapi: options.specs.<name>.servers is now a required list of strings; route conditions renamed; kind client no longer routes'
    - 'binding-mcp: options and routes restructured'
    - 'guard-jwt: the kind property was previously ignored and is now rejected'
status_page:
  published: false
  note: >-
    No status page exists and none is expected: status.aklivity.io does not
    resolve, and Aklivity runs no service whose availability it could report.
    Every Zilla deployment is availability-owned by the customer running it. No
    `type: StatusPage` pointer is wired in apis.yml.
  probe:
    url: https://status.aklivity.io/
    status: '000 (no DNS / no connection)'
